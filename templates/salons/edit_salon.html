{% extends 'base.html' %}

{% block content %}

<section class="page">
  <div class="page-header">
    <h2>Edit Salon Details</h2>
    <p>Update your salon information</p>
  </div>

  <div class="card form-card">
    <form method="post" class="form">
      {% csrf_token %}

      {{ form.as_p }}

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          Update Salon
        </button>

        <a href="{% url 'salon_dashboard' form.instance.id %}" class="btn btn-secondary">
          Cancel
        </a>
      </div>
    </form>
  </div>
</section>

{% endblock %}
