{% extends 'base.html' %}

{% block content %}

<section class="page">
  <div class="page-header">
    <h2>Create Your Salon</h2>
    <p>Add your salon details to start accepting bookings</p>
  </div>

  <div class="card form-card">
    <form method="post" class="form">
      {% csrf_token %}

      {{ form.as_p }}

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          Save Salon
        </button>

        <a href="/" class="btn btn-secondary">
          Cancel
        </a>
      </div>
    </form>
  </div>
</section>

{% endblock %}
