{% extends 'base.html' %}

{% block content %}

<section class="page">
  <div class="page-header">
    <h2>Edit Service</h2>
    <p>Update service details such as duration and price</p>
  </div>

  <div class="card form-card">
    <form method="post" class="form">
      {% csrf_token %}

      {{ form.as_p }}

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          Update Service
        </button>

        <a
          href="{% url 'salon_dashboard' service.salon.id %}"
          class="btn btn-secondary"
        >
          Cancel
        </a>
      </div>
    </form>
  </div>

</section>

{% endblock %}
